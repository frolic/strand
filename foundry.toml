[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# the whole repo is the test tree (colocated tests in src/, plus audits/ and
# benchmarks/); skip stops forge from compiling lib internals nobody imports
test = "."
skip = ["lib/**"]
script = "script"
solc = "0.8.24"
isolate = true
fs_permissions = [{ access = "read", path = "./"}]

[fmt]
tab_width = 2
bracket_spacing = true
sort_imports = true
